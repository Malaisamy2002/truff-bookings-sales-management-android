name: Build Android app

# Builds the Android app on GitHub's runners (needs the Android SDK/NDK +
# network access) and publishes it as a GitHub Release whenever a version
# tag (v*) is pushed. Extends build-android.yml's approach with signing.
#
# Signing is conditional: if the four ANDROID_KEYSTORE_* secrets exist
# (see REPO-SETUP.md), this builds a signed release .apk (split per ABI)
# and a signed .aab (Play Store format). If they don't exist yet, it falls
# back to unsigned debug APKs so the pipeline never hard-fails for a
# missing keystore — the release notes make clear which kind was produced.
#
# `src-tauri/gen/android/` is regenerated fresh every run via
# `tauri android init` (not committed — see ANDROID_BUILD.md). See
# REPO-SETUP.md "First run" for what to verify the first time this
# actually executes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "src-tauri/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-android.yml"

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check, lint, test
        run: |
          npm run typecheck:all
          npm run lint
          npm run test

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # Pin matches build-android.yml. Bump both together if `tauri android
      # init`'s log ever reports a different required NDK version.
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Point Tauri at the installed NDK
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Initialize the Android project
        run: npx tauri android init --ci

      # `tauri android init` writes Tauri's default launcher icons into the
      # freshly generated project. Overlay the app's own icons from
      # src-tauri/icons/android (same layout `tauri icon` produces) so the
      # APK/AAB do not ship the default Tauri logo.
      - name: Apply app launcher icons
        run: |
          RES=src-tauri/gen/android/app/src/main/res
          test -d "$RES"
          cp -R src-tauri/icons/android/. "$RES/"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cmp "src-tauri/icons/android/mipmap-$d/$f.png" "$RES/mipmap-$d/$f.png"
            done
          done
          cmp src-tauri/icons/android/values/ic_launcher_background.xml "$RES/values/ic_launcher_background.xml"
          echo "Launcher icons applied."

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check whether release signing secrets are present
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Decodes the keystore and writes the property file Tauri's Android
      # Gradle template reads for release signing. Property names match
      # Tauri's documented Android signing setup; confirm against a real
      # `app/build.gradle.kts` (generated by the init step above) on the
      # first actual run — see REPO-SETUP.md "First run".
      - name: Configure release signing
        if: steps.signing.outputs.signed == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/release.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK (split per ABI) + AAB
        if: steps.signing.outputs.signed == 'true'
        run: |
          npx tauri android build --apk --split-per-abi
          npx tauri android build --aab

      - name: Build unsigned debug APK (no keystore secrets configured)
        if: steps.signing.outputs.signed == 'false'
        run: npx tauri android build --apk --debug --split-per-abi

      - name: List built artifacts
        run: find src-tauri/gen/android/app/build/outputs -name '*.apk' -o -name '*.aab' -exec ls -lh {} \;

      - name: Resolve version from tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect release files and generate checksums
        run: |
          mkdir -p release-out
          find src-tauri/gen/android/app/build/outputs -name '*.apk' -exec cp {} release-out/ \;
          find src-tauri/gen/android/app/build/outputs -name '*.aab' -exec cp {} release-out/ \;
          cd release-out && sha256sum * > SHA256SUMS.txt

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v6
        with:
          name: truff-android-${{ steps.signing.outputs.signed == 'true' && 'release' || 'debug' }}-${{ steps.ver.outputs.version }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 30

      - name: Create/update GitHub Release with build attached
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Truff Bookings & Sales Management (Android) ${{ steps.ver.outputs.version }}
          body: |
            ${{ steps.signing.outputs.signed == 'true' && '**Signed release build** — installable directly, or submit the .aab to Play Console.' || '⚠️ **Unsigned DEBUG build** — ANDROID_KEYSTORE_* secrets are not configured yet (see REPO-SETUP.md), so this release is a debug build only. Not for distribution.' }}
          files: release-out/*
          generate_release_notes: true
